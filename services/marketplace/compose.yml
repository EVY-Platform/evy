name: marketplace

services:
  app:
    build:
      context: ../../
      dockerfile: ./services/marketplace/Dockerfile
      target: runner
    environment:
      - MARKETPLACE_WS_PORT=${MARKETPLACE_WS_PORT}
      - API_WS_HOST=host.docker.internal
      - API_PORT=${API_PORT}
      - DB_MARKETPLACE_DATABASE=${DB_MARKETPLACE_DATABASE}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_PORT=${DB_PORT}
      - DB_DOMAIN=host.docker.internal
    env_file:
      - ../../.env
    ports:
      - ${MARKETPLACE_WS_PORT}:${MARKETPLACE_WS_PORT}
    extra_hosts:
      - "host.docker.internal:host-gateway"
