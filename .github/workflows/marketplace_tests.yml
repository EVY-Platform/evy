name: Marketplace lint, build, and tests

on:
    pull_request:
        branches: [dev]
        paths-ignore:
            - "**/*.md"
    push:
        branches: [dev]
        paths-ignore:
            - "**/*.md"

jobs:
    marketplace_lint:
        defaults:
            run:
                working-directory: services/marketplace

        timeout-minutes: 1
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup environment
              uses: ./.github/actions/setup-bun
              id: setup
              with:
                  working-directory: services/marketplace
                  path-filter: "services/marketplace/**"
                  path-filter-extra: "types/**"

            - name: Run lint
              if: steps.setup.outputs.has-changes == 'true'
              run: bun run lint

    marketplace_build:
        defaults:
            run:
                working-directory: services/marketplace
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: ./.github/actions/setup-bun
              id: setup
              with:
                  working-directory: services/marketplace
                  path-filter: "services/marketplace/**"
                  path-filter-extra: "types/**"
            - run: bun run build
              if: steps.setup.outputs.has-changes == 'true'

    marketplace_tests:
        defaults:
            run:
                working-directory: services/marketplace
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: ./.github/actions/setup-bun
              id: setup
              with:
                  working-directory: services/marketplace
                  path-filter: "services/marketplace/**"
                  path-filter-extra: "types/**"
            - run: bun run test:unit
              if: steps.setup.outputs.has-changes == 'true'
              env:
                  DB_USER: evy
                  DB_PASS: evy
                  DB_PORT: 5432
                  DB_DOMAIN: localhost
                  DB_MARKETPLACE_DATABASE: marketplace
                  MARKETPLACE_WS_PORT: 8001
