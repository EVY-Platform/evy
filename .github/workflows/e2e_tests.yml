name: E2E Tests

on:
    pull_request:
        branches: [dev]
    push:
        branches: [dev]
    workflow_dispatch:

# NOTE: iOS e2e tests require macOS 26 (for iOS 26.2 simulator) + Docker.
# GitHub-hosted ARM macOS runners don't support Docker (no nested virtualization).
# iOS tests must be run locally or on a self-hosted runner with Docker Desktop.

jobs:
    e2e_tests:
        permissions:
            contents: read
            packages: read
        timeout-minutes: 2
        runs-on: blacksmith-2vcpu-ubuntu-2404-arm

        services:
            postgres:
                image: postgres:16
                ports:
                    - 5432:5432
                env:
                    POSTGRES_USER: evy
                    POSTGRES_PASSWORD: evy
                    POSTGRES_DB: evy
                options: >-
                    --health-cmd "pg_isready -U evy -d evy"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Check for E2E-relevant changes
              uses: dorny/paths-filter@v4
              id: paths
              with:
                  filters: |
                      e2e:
                        - 'api/**'
                        - 'web/**'
                        - 'ios/**'
                        - 'types/**'
                        - 'services/**'
                        - 'run-e2e.sh'
                        - '.github/workflows/e2e_tests.yml'
                        - '.github/actions/**'

            - name: Setup Bun
              if: github.event_name == 'workflow_dispatch' || steps.paths.outputs.e2e == 'true'
              uses: oven-sh/setup-bun@v2

            - name: Create marketplace database
              if: github.event_name == 'workflow_dispatch' || steps.paths.outputs.e2e == 'true'
              run: docker exec ${{ job.services.postgres.id }} createdb -U evy marketplace

            - name: Install dependencies
              if: github.event_name == 'workflow_dispatch' || steps.paths.outputs.e2e == 'true'
              run: bun run install:all

            - name: Prepare .env and generate types
              if: github.event_name == 'workflow_dispatch' || steps.paths.outputs.e2e == 'true'
              uses: ./.github/actions/prepare-dotenv-and-types

            - name: Install Playwright browsers
              if: github.event_name == 'workflow_dispatch' || steps.paths.outputs.e2e == 'true'
              run: bun run --cwd web test:setup

            - name: Run E2E tests
              if: github.event_name == 'workflow_dispatch' || steps.paths.outputs.e2e == 'true'
              env:
                  MARKETPLACE_GRPC_HOST: 127.0.0.1
              run: bash run-e2e.sh --skip-ios --no-docker

            - name: Upload Playwright report
              uses: actions/upload-artifact@v7
              if: always() && (github.event_name == 'workflow_dispatch' || steps.paths.outputs.e2e == 'true')
              with:
                  name: e2e-tests-playwright-report
                  path: web/playwright-report/
                  retention-days: 1
