name: E2E Tests

on:
    pull_request:
        branches: [dev]
        paths-ignore:
            - "**/*.md"
    push:
        branches: [dev]
        paths-ignore:
            - "**/*.md"
    workflow_dispatch:

jobs:
    e2e_tests:
        permissions:
            contents: read
            packages: read
        timeout-minutes: 25
        runs-on: blacksmith-6vcpu-macos-26

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Check for E2E-relevant changes
              uses: dorny/paths-filter@v4
              id: paths
              with:
                  filters: |
                      e2e:
                        - 'api/**'
                        - 'web/**'
                        - 'ios/**'
                        - 'types/**'
                        - 'services/**'
                        - 'run-e2e.sh'
                        - '.github/workflows/e2e_tests.yml'
                        - '.github/actions/**'
                        - '!**/*.md'

            - name: Setup Bun
              if:
                  github.event_name == 'workflow_dispatch' || steps.paths.outputs.e2e ==
                  'true'
              uses: oven-sh/setup-bun@v2

            - name: Prepare .env
              if:
                  github.event_name == 'workflow_dispatch' || steps.paths.outputs.e2e ==
                  'true'
              uses: ./.github/actions/prepare-dotenv

            - name: Start PostgreSQL on host
              if:
                  github.event_name == 'workflow_dispatch' || steps.paths.outputs.e2e ==
                  'true'
              run: |
                  set -euo pipefail
                  set -a
                  source .env
                  set +a
                  DB_MARKETPLACE_DATABASE="${DB_MARKETPLACE_DATABASE:-marketplace}"
                  brew install postgresql@16
                  PG_BIN="$(brew --prefix postgresql@16)/bin"
                  echo "$PG_BIN" >> "$GITHUB_PATH"
                  export PGDATA="${RUNNER_TEMP}/pgdata"
                  "$PG_BIN/initdb" -D "$PGDATA" -U postgres -A trust -E UTF8 --locale=C
                  "$PG_BIN/pg_ctl" -D "$PGDATA" -o "-p 5432" -l "${RUNNER_TEMP}/postgres.log" -w start
                  "$PG_BIN/psql" -h localhost -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 \
                    -c "CREATE USER evy WITH PASSWORD 'evy' CREATEDB;"
                  "$PG_BIN/createdb" -h localhost -p 5432 -U postgres -O evy evy
                  "$PG_BIN/createdb" -h localhost -p 5432 -U postgres -O evy "$DB_MARKETPLACE_DATABASE"

            - name: Install dependencies
              if:
                  github.event_name == 'workflow_dispatch' || steps.paths.outputs.e2e ==
                  'true'
              run: bun run install:all

            - name: Install Playwright browsers
              if:
                  github.event_name == 'workflow_dispatch' || steps.paths.outputs.e2e ==
                  'true'
              run: bun run --cwd web test:setup

            - name: Verify Xcode and iOS simulators
              if:
                  github.event_name == 'workflow_dispatch' || steps.paths.outputs.e2e ==
                  'true'
              run: |
                  set -euo pipefail
                  xcodebuild -version

            - name: Run E2E tests
              if:
                  github.event_name == 'workflow_dispatch' || steps.paths.outputs.e2e ==
                  'true'
              env:
                  MARKETPLACE_WS_HOST: 127.0.0.1
                  IOS_SIMULATOR_DEVICE_NAME: iPhone 17
                  IOS_SIMULATOR_OS_VERSION: 26.5
                  GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
              run: bash run-e2e.sh --ci

            - name: Upload Playwright report
              uses: actions/upload-artifact@v7
              if: always() && (github.event_name == 'workflow_dispatch' ||
                  steps.paths.outputs.e2e == 'true')
              with:
                  name: e2e-tests-playwright-report
                  path: web/playwright-report/
                  retention-days: 1
