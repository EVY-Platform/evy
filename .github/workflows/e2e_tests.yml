name: E2E Tests

on:
    pull_request:
        branches: [dev]
        paths-ignore:
            - "**/*.md"
    push:
        branches: [dev]
        paths-ignore:
            - "**/*.md"
    workflow_dispatch:

jobs:
    e2e_tests:
        permissions:
            contents: read
            packages: read
        timeout-minutes: 10
        runs-on: blacksmith-6vcpu-macos-26

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Check for E2E-relevant changes
              uses: dorny/paths-filter@v4
              id: paths
              with:
                  filters: |
                      e2e:
                        - 'api/**'
                        - 'web/**'
                        - 'ios/**'
                        - 'types/**'
                        - 'services/**'
                        - 'run-e2e.sh'
                        - '.github/workflows/e2e_tests.yml'
                        - '.github/actions/**'
                        - '!**/*.md'

            - name: Setup Bun
              if:
                  github.event_name == 'workflow_dispatch' || steps.paths.outputs.e2e ==
                  'true'
              uses: oven-sh/setup-bun@v2

            - name: Install dependencies
              if:
                  github.event_name == 'workflow_dispatch' || steps.paths.outputs.e2e ==
                  'true'
              run: bun run install:all

            - name: Prepare .env and generate types
              if:
                  github.event_name == 'workflow_dispatch' || steps.paths.outputs.e2e ==
                  'true'
              uses: ./.github/actions/prepare-dotenv-and-types

            - name: Install Playwright browsers
              if:
                  github.event_name == 'workflow_dispatch' || steps.paths.outputs.e2e ==
                  'true'
              run: bun run --cwd web test:setup

            - name: Start Docker daemon
              if:
                  github.event_name == 'workflow_dispatch' || steps.paths.outputs.e2e ==
                  'true'
              shell: bash
              run: |
                  set -euo pipefail

                  if ! command -v docker >/dev/null 2>&1; then
                      echo "Docker CLI is not installed on this runner."
                      exit 1
                  fi

                  if ! docker info >/dev/null 2>&1; then
                      if [ ! -d /Applications/Docker.app ]; then
                          echo "Docker daemon is not running and /Applications/Docker.app is unavailable."
                          exit 1
                      fi

                      open -a Docker
                      for _ in {1..60}; do
                          if docker info >/dev/null 2>&1; then
                              break
                          fi
                          sleep 2
                      done
                  fi

                  docker info
                  docker compose version

            - name: Verify Xcode and iOS simulators
              if:
                  github.event_name == 'workflow_dispatch' || steps.paths.outputs.e2e ==
                  'true'
              run: |
                  set -euo pipefail
                  echo "Available Xcode apps:"
                  ls -1d /Applications/Xcode*.app 2>/dev/null || true
                  echo "Selected developer directory:"
                  xcode-select -p
                  xcodebuild -version
                  xcodebuild -showsdks
                  xcodebuild -showdestinations -project ios/evy.xcodeproj -scheme evy | sed -n '1,80p'

            - name: Run E2E tests
              if:
                  github.event_name == 'workflow_dispatch' || steps.paths.outputs.e2e ==
                  'true'
              env:
                  IOS_SIMULATOR_DEVICE_NAME: iPhone 17
                  IOS_SIMULATOR_OS_VERSION: 26.5
              run: bash run-e2e.sh

            - name: Upload Playwright report
              uses: actions/upload-artifact@v7
              if: always() && (github.event_name == 'workflow_dispatch' ||
                  steps.paths.outputs.e2e == 'true')
              with:
                  name: e2e-tests-playwright-report
                  path: web/playwright-report/
                  retention-days: 1
