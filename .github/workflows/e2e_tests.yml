name: E2E Tests

on:
    pull_request:
        branches: [dev]
    push:
        branches: [dev]
    workflow_dispatch:

# E2E runs on Blacksmith macOS so iOS Simulator tests can run in CI. PostgreSQL is started on the host
# (Homebrew); api/marketplace/web run via `run-e2e.sh --no-docker` (no Docker required for this job).

jobs:
    e2e_tests:
        permissions:
            contents: read
            packages: read
        timeout-minutes: 30
        runs-on: blacksmith-6vcpu-macos-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Check for E2E-relevant changes
              uses: dorny/paths-filter@v4
              id: paths
              with:
                  filters: |
                      e2e:
                        - 'api/**'
                        - 'web/**'
                        - 'ios/**'
                        - 'types/**'
                        - 'services/**'
                        - 'run-e2e.sh'
                        - '.github/workflows/e2e_tests.yml'
                        - '.github/actions/**'

            - name: Setup Bun
              if: github.event_name == 'workflow_dispatch' || steps.paths.outputs.e2e == 'true'
              uses: oven-sh/setup-bun@v2

            - name: Start PostgreSQL on host
              if: github.event_name == 'workflow_dispatch' || steps.paths.outputs.e2e == 'true'
              run: |
                  set -euo pipefail
                  brew install postgresql@16
                  PG_BIN="$(brew --prefix postgresql@16)/bin"
                  echo "$PG_BIN" >> "$GITHUB_PATH"
                  export PGDATA="${RUNNER_TEMP}/pgdata"
                  "$PG_BIN/initdb" -D "$PGDATA" -U postgres -A trust -E UTF8 --locale=C
                  "$PG_BIN/pg_ctl" -D "$PGDATA" -o "-p 5432" -l "${RUNNER_TEMP}/postgres.log" -w start
                  "$PG_BIN/psql" -h localhost -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 \
                    -c "CREATE USER evy WITH PASSWORD 'evy' CREATEDB;"
                  "$PG_BIN/createdb" -h localhost -p 5432 -U postgres -O evy evy
                  "$PG_BIN/createdb" -h localhost -p 5432 -U postgres -O evy marketplace

            - name: Install dependencies
              if: github.event_name == 'workflow_dispatch' || steps.paths.outputs.e2e == 'true'
              run: bun run install:all

            - name: Prepare .env and generate types
              if: github.event_name == 'workflow_dispatch' || steps.paths.outputs.e2e == 'true'
              uses: ./.github/actions/prepare-dotenv-and-types

            - name: Install Playwright browsers
              if: github.event_name == 'workflow_dispatch' || steps.paths.outputs.e2e == 'true'
              run: bun run --cwd web test:setup

            - name: Select Xcode for iOS tests
              if: github.event_name == 'workflow_dispatch' || steps.paths.outputs.e2e == 'true'
              run: |
                  sudo xcode-select -s /Applications/Xcode_26.4.1.app
                  xcodebuild -version
                  xcodebuild -showdestinations -project ios/evy.xcodeproj -scheme evy | head -n 80

            - name: Run E2E tests
              if: github.event_name == 'workflow_dispatch' || steps.paths.outputs.e2e == 'true'
              env:
                  MARKETPLACE_GRPC_HOST: 127.0.0.1
                  IOS_SIMULATOR_DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=26.4.1
              run: bash run-e2e.sh --no-docker

            - name: Upload Playwright report
              uses: actions/upload-artifact@v7
              if: always() && (github.event_name == 'workflow_dispatch' || steps.paths.outputs.e2e == 'true')
              with:
                  name: e2e-tests-playwright-report
                  path: web/playwright-report/
                  retention-days: 1
