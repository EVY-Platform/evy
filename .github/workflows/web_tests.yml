name: Web Tests

on:
    pull_request:
        branches: [dev]
    push:
        branches: [dev]

jobs:
    web_tests:
        permissions:
            contents: read
            packages: read
        defaults:
            run:
                working-directory: web

        timeout-minutes: 3
        runs-on: blacksmith-2vcpu-ubuntu-2404-arm

        services:
            postgres:
                image: postgres:16
                ports:
                    - 5432:5432
                env:
                    POSTGRES_USER: evy
                    POSTGRES_PASSWORD: evy
                    POSTGRES_DB: evy
                options: >-
                    --health-cmd "pg_isready -U evy -d evy"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup environment
              uses: ./.github/actions/setup-bun
              id: setup
              with:
                  working-directory: web
                  path-filter: 'web/**'
                  path-filter-extra: 'types/**'

            - name: Install root dependencies
              if: steps.setup.outputs.has-changes == 'true'
              run: bun install
              working-directory: .

            - name: Create marketplace database
              if: steps.setup.outputs.has-changes == 'true'
              run: docker exec ${{ job.services.postgres.id }} createdb -U evy marketplace

            - name: Prepare .env and generate types
              if: steps.setup.outputs.has-changes == 'true'
              uses: ./.github/actions/prepare-dotenv-and-types

            - name: Install Playwright browsers
              if: steps.setup.outputs.has-changes == 'true'
              run: bun run test:setup

            - name: Build application
              if: steps.setup.outputs.has-changes == 'true'
              run: bun run build

            - name: Run unit tests
              if: steps.setup.outputs.has-changes == 'true'
              run: bun run test:unit

            - name: Run integration tests
              if: steps.setup.outputs.has-changes == 'true'
              run: bun run test:integration

            - name: Upload test results
              uses: actions/upload-artifact@v7
              if: always() && steps.setup.outputs.has-changes == 'true'
              with:
                  name: web-tests-playwright-report
                  path: web/playwright-report/
                  retention-days: 1
