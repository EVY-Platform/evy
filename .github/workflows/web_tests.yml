name: Web Tests

on:
    pull_request:
        branches: [dev]
        paths-ignore:
            - '**/*.md'
    push:
        branches: [dev]
        paths-ignore:
            - '**/*.md'

jobs:
    web_tests:
        permissions:
            contents: read
            packages: read
        defaults:
            run:
                working-directory: web

        timeout-minutes: 5
        runs-on: blacksmith-4vcpu-ubuntu-2404-arm

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup environment
              uses: ./.github/actions/setup-bun
              id: setup
              with:
                  working-directory: web
                  path-filter: 'web/**'
                  path-filter-extra: 'types/**'

            - name: Install root dependencies
              if: steps.setup.outputs.has-changes == 'true'
              run: bun install
              working-directory: .

            - name: Prepare .env and generate types
              if: steps.setup.outputs.has-changes == 'true'
              uses: ./.github/actions/prepare-dotenv-and-types

            - name: Install Playwright browsers
              if: steps.setup.outputs.has-changes == 'true'
              run: bun run test:setup

            - name: Build application
              if: steps.setup.outputs.has-changes == 'true'
              run: bun run build

            - name: Run unit tests
              if: steps.setup.outputs.has-changes == 'true'
              run: bun run test:unit

            - name: Run integration tests
              if: steps.setup.outputs.has-changes == 'true'
              run: bun run test:integration

            - name: Upload test results
              uses: actions/upload-artifact@v7
              if: always() && steps.setup.outputs.has-changes == 'true'
              with:
                  name: web-tests-playwright-report
                  path: web/playwright-report/
                  retention-days: 1
