name: Web

on:
    pull_request:
        branches: [dev]
        paths-ignore:
            - "**/*.md"
    push:
        branches: [dev]
        paths-ignore:
            - "**/*.md"

jobs:
    web_lint:
        uses: ./.github/workflows/reusable-bun-lint.yml
        with:
            working-directory: web
            path-filter: "web/**"
            path-filter-extra: "types/**"

    web_tests:
        permissions:
            contents: read
            packages: read
        defaults:
            run:
                working-directory: web

        timeout-minutes: 8
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup environment
              uses: ./.github/actions/setup-bun
              id: setup
              with:
                  working-directory: web
                  path-filter: "web/**"
                  path-filter-extra: "types/**"

            - name: Prepare .env
              if: steps.setup.outputs.has-changes == 'true'
              uses: ./.github/actions/prepare-dotenv

            - name: Install Playwright browsers
              if: steps.setup.outputs.has-changes == 'true'
              run: bun run test:setup

            - name: Build application
              if: steps.setup.outputs.has-changes == 'true'
              run: bun run build

            - name: Run unit tests
              if: steps.setup.outputs.has-changes == 'true'
              run: bun run test:unit

            - name: Run integration tests
              if: steps.setup.outputs.has-changes == 'true'
              run: bun run test:integration

            - name: Upload test results
              uses: actions/upload-artifact@v7
              if: always() && steps.setup.outputs.has-changes == 'true'
              with:
                  name: web-tests-playwright-report
                  path: web/playwright-report/
                  retention-days: 1
