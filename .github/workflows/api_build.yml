name: API Build

on:
    pull_request:
        branches: [dev]
        paths-ignore:
            - "**/*.md"
    push:
        branches: [dev]
        paths-ignore:
            - "**/*.md"

jobs:
    api_build:
        defaults:
            run:
                working-directory: api

        timeout-minutes: 1
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup environment
              uses: ./.github/actions/setup-bun
              id: setup
              with:
                  working-directory: api
                  path-filter: "api/**"
                  path-filter-extra: "types/**"

            - name: Run build
              if: steps.setup.outputs.has-changes == 'true'
              run: bun run build
