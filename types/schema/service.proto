syntax = "proto3";

package evy;

// Non-evy backend services implement this interface (data-only; no SDUI).
service Service {
  rpc Get (GetRequest) returns (GetResponse);
  rpc Create (CreateRequest) returns (CreateResponse);
  rpc Update (UpdateRequest) returns (UpdateResponse);
  rpc Delete (DeleteRequest) returns (DeleteResponse);
  rpc Api (ApiRequest) returns (ApiResponse);
  rpc SubscribeEvents (SubscribeEventsRequest) returns (stream ServiceEvent);
}

message GetRequest {
  string service = 1;
  string resource = 2;
  Filter filter = 3;
}

message CreateRequest {
  string service = 1;
  string resource = 2;
  Filter filter = 3;
  string data_json = 4;
}

message UpdateRequest {
  string service = 1;
  string resource = 2;
  Filter filter = 3;
  string data_json = 4;
}

message DeleteRequest {
  string service = 1;
  string resource = 2;
  Filter filter = 3;
}

message ApiRequest {
  string service = 1;
  string resource = 2;
  string method = 3;
  Filter filter = 4;
  string data_json = 5;
}

message Filter {
  string id = 1;
  string updated_after = 2;
}

message GetResponse {
  string result_json = 1;
}

message CreateResponse {
  string result_json = 1;
}

message UpdateResponse {
  string result_json = 1;
}

message DeleteResponse {
  string result_json = 1;
}

message ApiResponse {
  string result_json = 1;
}

message SubscribeEventsRequest {}

message ServiceEvent {
  string event_name = 1;
  string payload_json = 2;
}
