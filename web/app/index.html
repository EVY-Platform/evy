<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>EVY App builder</title>
		<meta
			name="description"
			content="The EVY App builder is a tool that allows you to build apps for EVY"
		/>
		<link rel="icon" href="/favicon.ico" />
		<link rel="stylesheet" href="/globals.css" />
	</head>
	<body>
		<div class="evy-desktop-width-message" aria-label="Open the EVY builder on desktop">
			<img
				class="evy-desktop-width-message-logo"
				src="/logo.svg"
				alt=""
				aria-hidden="true"
			/>
			<p class="evy-desktop-width-message-text">
				Want to build an app? Open the builder on your desktop and change the world!
			</p>
		</div>
		<div id="root"></div>
		<script type="module" src="/bundle.js"></script>
	</body>
</html>
