services:
    postgres:
        image: "postgres:16"
        ports:
            - ${DB_PORT}:5432
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASS}
            POSTGRES_DB: ${DB_EVY_DATABASE}
            DB_MARKETPLACE_DATABASE: ${DB_MARKETPLACE_DATABASE}
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./scripts/postgres-init-marketplace.sh:/docker-entrypoint-initdb.d/02-marketplace.sh:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
            interval: 5s
            timeout: 5s
            retries: 5

    marketplace:
        build:
            context: .
            dockerfile: ./services/marketplace/Dockerfile
            target: runner
        ports:
            - ${MARKETPLACE_WS_PORT}:${MARKETPLACE_WS_PORT}
        environment:
            - MARKETPLACE_WS_PORT=${MARKETPLACE_WS_PORT}
            - DB_MARKETPLACE_DATABASE=${DB_MARKETPLACE_DATABASE}
            - DB_USER=${DB_USER}
            - DB_PASS=${DB_PASS}
            - DB_PORT=5432
            - DB_DOMAIN=postgres
        depends_on:
            postgres:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "bun", "run", "health"]
            interval: 500ms
            timeout: 1s
            retries: 10
            start_period: 100ms

    api:
        build:
            context: .
            dockerfile: ./api/Dockerfile
            target: runner
        ports:
            - ${API_PORT}:${API_PORT}
            - ${STRIPE_WEBHOOK_PORT:-8002}:${STRIPE_WEBHOOK_PORT:-8002}
        environment:
            - DB_USER=${DB_USER}
            - DB_PASS=${DB_PASS}
            - DB_PORT=5432
            - DB_DOMAIN=postgres
            - DB_EVY_DATABASE=${DB_EVY_DATABASE}
            - API_PORT=${API_PORT}
            # WebSocket client target (Compose DNS name), not the marketplace bind address in `.env`.
            - MARKETPLACE_WS_HOST=marketplace
            - MARKETPLACE_WS_PORT=${MARKETPLACE_WS_PORT}
            - GOOGLE_PLACES_API_KEY=${GOOGLE_PLACES_API_KEY}
            - GOOGLE_PLACES_MOCK=${GOOGLE_PLACES_MOCK:-}
            - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
            - STRIPE_ACCOUNT_ID=${STRIPE_ACCOUNT_ID}
            - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
            - STRIPE_WEBHOOK_PORT=${STRIPE_WEBHOOK_PORT:-8002}
            - STRIPE_MOCK=${STRIPE_MOCK:-}
        depends_on:
            postgres:
                condition: service_healthy
            marketplace:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "bun", "run", "health"]
            interval: 500ms
            timeout: 1s
            retries: 10
            start_period: 100ms

    web:
        build:
            context: .
            dockerfile: web/Dockerfile
            target: runner
            args:
                API_URL: ${API_URL}
        ports:
            - ${WEB_PORT}:${WEB_PORT}
        environment:
            - WEB_PORT=${WEB_PORT}
            - API_URL=${API_URL}
        depends_on:
            api:
                condition: service_healthy

volumes:
    postgres_data:
